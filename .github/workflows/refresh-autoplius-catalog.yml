name: Refresh Autoplius catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_autoplius_catalog.py"
      - ".github/workflows/refresh-autoplius-catalog.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download full make/model catalog
        run: python scripts/update_autoplius_catalog.py
      - name: Commit catalog snapshot
        run: |
          if git diff --quiet -- autoplius_catalog.json; then
            echo "Catalog snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autoplius_catalog.json
          git commit -m "Refresh Autoplius make and model catalog"
          git push
